# Plain unit-test run: H2 in PostgreSQL mode, in-memory fingerprint store. No Docker, Redis or PostgreSQL needed.
spring:
  datasource:
    url: jdbc:h2:mem:ledgerline;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  data:
    redis:
      repositories:
        enabled: false

ledgerline:
  fingerprint:
    store: memory
